name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VIENNAFLOW_ENV: development
      GOOGLE_MAPS_API_KEY: ci-public-browser-fixture
      GOOGLE_MAPS_MAP_ID: ci-map-fixture
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-public-anonymous-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:database
      - run: npm audit --omit=dev --audit-level=high
